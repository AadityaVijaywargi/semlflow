# CONTINUOUS TRAINING - retrains both models and logs everything to MLflow when
#   * code / params / data definition change,
#   * every Monday at 02:00 UTC (scheduled retraining),
#   * someone clicks "Run workflow" in the Actions tab.
name: CT

on:
  push:
    branches: [main]
    paths: ["src/**", "params.yaml", "dvc.yaml", "data/**", "requirements.txt"]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # lets the job commit the refreshed dvc.lock + metrics

concurrency:
  group: ct
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      # Optional: set these repo secrets to log to a hosted MLflow (e.g. DagsHub).
      # When empty, scripts/run_with_mlflow.sh starts a local MLflow server instead.
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --force => always retrain (that is the point of continuous training)
      - name: Run DVC pipeline (prepare -> train_ml -> train_dl -> evaluate)
        run: bash scripts/run_with_mlflow.sh dvc repro --force

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Continuous training results"
            echo
            [ -f reports/summary.md ] && cat reports/summary.md
            echo
            echo '```'
            dvc metrics show || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Download this artifact, unzip, run `make ui` -> full MLflow GUI with all runs.
      - name: Upload MLflow results (GUI data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results
          path: |
            mlflow.db
            mlartifacts/
            metrics/
            reports/
          if-no-files-found: warn

      - name: Commit refreshed dvc.lock and metrics
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dvc.lock metrics reports/summary.json data/.gitignore models/.gitignore 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ct: update dvc.lock and metrics [skip ci]"
          git push || true
