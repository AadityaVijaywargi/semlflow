# CONTINUOUS DELIVERY - after CI succeeds on main: run the pipeline, then package the
# MLflow web GUI (with all experiment results + registered models) as a Docker image
# and publish it to GitHub Container Registry.
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # NOTE: CD always uses its own local MLflow server so the DB + artifacts are portable
      - name: Train + register models
        env:
          MLFLOW_TRACKING_URI: ""
        run: bash scripts/run_with_mlflow.sh dvc repro --force

      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/mlflow-ui" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          load: true
          tags: ${{ env.IMAGE }}:test

      - name: Smoke test - GUI must answer on /health
        run: |
          docker run -d --name ui -p 5000:5000 "$IMAGE:test"
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && break; sleep 2; done
          curl -sf http://localhost:5000/health
          curl -sf -X POST http://localhost:5000/api/2.0/mlflow/experiments/search \
            -H 'Content-Type: application/json' -d '{"max_results": 10}' | grep -q mlops-demo
          docker rm -f ui

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Summary
        run: |
          {
            echo "## Delivered MLflow GUI image"
            echo '```'
            echo "docker run --rm -p 5000:5000 ${IMAGE}:latest"
            echo '```'
            echo "Then open http://localhost:5000"
            echo
            cat reports/summary.md
          } >> "$GITHUB_STEP_SUMMARY"
